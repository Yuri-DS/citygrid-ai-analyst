[theme]
base = "dark"

[server]
# Increase WebSocket timeout for long LLM responses
enableWebsocketCompression = false
fileWatcherType = "none"
maxMessageSize = 1000

[browser]
# Disable CORS issues
gatherUsageStats = false

[runner]
# Increase timeout for long running operations
fastReruns = true

[client]
# Show error details
showErrorDetails = true